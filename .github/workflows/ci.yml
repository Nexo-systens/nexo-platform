name: CI

# Mission 195 — Founding Company Production Onboarding & First
# Executive Value, Seção 55. Mission 194 identificou a ausência de CI
# como dívida técnica: as suítes committed (`tests/financial-ingestion/`,
# `tests/executive-report/`, `tests/activation/`) protegem semântica
# financeira/de apresentação/de ativação crítica para produção, mas
# nunca haviam sido conectadas a um pipeline — rodavam apenas quando
# alguém lembrava de executá-las manualmente. Workflow mínimo,
# consistente com o repositório: instala, type-checka, linta, roda as
# suítes e builda — nenhuma automação de deploy, nenhum ambiente
# novo, nenhum secret além dos já necessários para `next build`
# (nenhuma chamada real a Supabase/IA acontece em nenhum passo).
#
# Mission 197 — Production Surface & Deployment Closure Gate. Este
# workflow rodou pela primeira vez contra um runner real nesta missão
# (`gh run view`, leitura, nenhuma configuração de repositório alterada)
# e FALHOU: `node-version: "20"` mais o shell `bash` padrão do runner
# (sem `globstar`) faziam `tests/financial-ingestion/**/*.test.ts`
# (glob sem aspas em `package.json`) expandir de forma NÃO recursiva —
# `**` sem globstar equivale a um único `*`, então o padrão só batia
# arquivos exatamente UM nível abaixo (`tests/financial-ingestion/
# document-governance/*.test.ts`, 28 dos 65 testes), nunca os arquivos
# diretamente em `tests/executive-report/*.test.ts` (zero subpastas —
# zero arquivos encontrados, falha explícita "Could not find"). Local
# mente nunca reproduzia porque `npm run` nesta máquina passa pelo
# `cmd.exe` do Windows (que não expande glob nenhum), deixando o glob
# resolver corretamente dentro do próprio `tsx`/Node. Corrigido na
# raiz — `package.json` agora usa os quatro padrões `--test` sempre
# ENTRE ASPAS (nunca expandidos por nenhum shell, resolvidos pelo
# glob recursivo do próprio Node — mesmo resultado determinístico em
# qualquer SO) — e `node-version` passou de "20" para "24" (versão
# real usada em desenvolvimento; `@supabase/auth-js`/`functions-js`/
# `postgrest-js` já declaram `engines.node >= 22`, e Node 20 emitia
# `EBADENGINE` a cada `npm ci`, nunca antes observado por não haver
# execução real contra um runner até esta missão).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Financial ingestion regression suite
        run: npm run test:financial-ingestion

      - name: Executive report regression suite
        run: npm run test:executive-report

      - name: Activation regression suite
        run: npm run test:activation

      - name: Production surface regression suite
        run: npm run test:production-surface

      - name: Release candidate regression suite
        run: npm run test:release-candidate

      - name: Build
        run: npm run build
        env:
          # `next build` só precisa das variáveis PÚBLICAS existirem
          # para compilar (nenhuma chamada de rede real acontece durante
          # o build; nenhum segredo de Service Role é necessário aqui).
          # Fallback para um valor placeholder quando os secrets do
          # repositório ainda não foram configurados — nunca falha o CI
          # por um secret ausente que esta missão não tem como
          # configurar; se os secrets reais existirem, prevalecem.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
